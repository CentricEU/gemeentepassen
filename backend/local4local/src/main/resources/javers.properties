# ===============================
# JaVers Configuration
# Documentation: https://javers.org/documentation/getting-started/
# ===============================

# Use a dedicated schema for audit tables unless overridden per profile.
javers.sqlSchema=${local4local.javers.sql-schema:l4l_audit}

# Mapping strategy: access fields directly (recommended)
javers.mappingStyle=field

# Pretty print JSON output for better readability
javers.prettyPrint=true

# Store initial full snapshot on object creation
javers.newObjectsSnapshot=true

# Enable automatic auditing for Spring Data repositories
javers.springDataAuditableRepositoryAspectEnabled=true


# ===============================
# Logging (disable in production)
# ===============================
logging.level.org.javers=OFF
