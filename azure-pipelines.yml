# CityPasses (Gemeentepassen) — CI pipeline
# Builds the Nx/Angular frontend apps and runs their unit tests.
# NOTE: backend (Maven) and Playwright suites are not yet covered here — see README "CI/CD" section.

trigger:
  - development

pool:
  name: default

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.19.5'
    displayName: 'Install Node.js 20'

  - script: |
      npm install --legacy-peer-deps
    workingDirectory: frontend
    displayName: 'Install frontend dependencies'

  - script: |
      npx nx run-many --all --target=build --configuration=production
    workingDirectory: frontend
    displayName: 'Build frontend apps'

  - script: |
      npm run all-tests
    workingDirectory: frontend
    displayName: 'Run frontend unit tests'
