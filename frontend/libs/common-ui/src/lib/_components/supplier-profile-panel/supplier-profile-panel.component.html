<windmill-card [hasFooter]="true" [hasHeader]="false" [borderRadius]="'bottom'">
  <ng-container card-content>
    <frontend-supplier-profile #profileInformation [isReadOnly]="isReadOnly"></frontend-supplier-profile>
  </ng-container>

  <ng-container card-footer>
    <div class="flex-row-center footer-actions">
      @if (isReadOnly) {
        <centric-button type="outlined-theme" (click)="suspendSupplier()">{{
          'general.button.suspendSupplier' | translate
        }}</centric-button>
      } @else {
        <centric-button [disabled]="shouldDisableFinishButton()" class="pointer" (click)="saveChanges()">{{
          actionButtonText | translate
        }}</centric-button>
      }
    </div>
  </ng-container>
</windmill-card>
