<span mat-dialog-title>
  <h1>{{ 'modal.manageColumns.title' | translate }}</h1>
  @if (!data.hideCancelButton) {
    <button
      mat-dialog-close
      windmill-tooltip
      class="close-button"
      ariaAttributes
      [ariaLabelTranslation]="'general.button.close' | translate"
      [attr.ariaLabel]="'general.button.close' | translate"
      [tooltipColor]="'surface'"
      [tooltipText]="'general.button.close' | translate"
      (click)="close()">
      <windmill-icon [svgIcon]="'cancel_b'" [size]="'16'"></windmill-icon>
    </button>
  }
</span>
<div mat-dialog-content>
  <p class="modal-description">{{ 'modal.manageColumns.description' | translate }}</p>
  <section class="columns-section">
    @for (item of tableColumns; track item) {
      @if (!item.isFixed) {
        <windmill-checkbox
          ariaAttributes
          [ariaLabelTranslation]="item.columnLabel | translate"
          [(ngModel)]="item.isChecked"
          [disabled]="!!item.isDefault"
          [label]="item.columnLabel | translate">
        </windmill-checkbox>
      }
    }
  </section>
</div>
<div mat-dialog-actions>
  <centric-button type="ghost-greyscale" (click)="close()">
    {{ 'general.button.cancel' | translate }}
  </centric-button>
  <centric-button [disabled]="isButtonDisabled()" (click)="accept()">
    {{ 'general.button.applyChanges' | translate }}
  </centric-button>
</div>
