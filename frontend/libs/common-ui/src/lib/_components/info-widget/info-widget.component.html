<windmill-card class="styled-content" [hasShadow]="true" [hasHeader]="false">
	<div card-content class="info-widget">
		<div class="info-widget-icon">
			<windmill-icon [size]="'32'" [svgIcon]="icon"></windmill-icon>
		</div>
		<div class="info-widget-right">
			<p class="info-widget-title">{{ title }}</p>
			<p class="info-widget-value">{{ value }}</p>
		</div>
	</div>
</windmill-card>
