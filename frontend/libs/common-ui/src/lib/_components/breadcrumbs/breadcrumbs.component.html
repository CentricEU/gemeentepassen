@if (displayBreadcrumbs) {
	<centric-breadcrumbs
		[ariaLabel]="'ariaLabel.breadcrumbs' | translate"
		[ariaDescription]="'ariaDescription.breadcrumbs' | translate">
		<ol class="breadcrumbs-container">
			@for (crumb of breadcrumbs; track crumb) {
				<li>
					<a
						(keydown.enter)="navigateToCrumb(crumb)"
						(click)="navigateToCrumb(crumb)"
						title="{{ crumb.translationLabel | translate }}">
						{{ crumb.translationLabel | translate }}
					</a>
				</li>
			}
		</ol>
	</centric-breadcrumbs>
}
